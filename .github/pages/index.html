<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daniel Tu — Resume</title>
<meta name="description" content="Resume of Daniel Tu, AI Engineer and Software Engineer.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5c6470;
    --accent: #2e74b5;
    --border: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e8eaed;
      --muted: #9aa4b2;
      --accent: #6f99de;
      --border: #2a2f37;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem 1rem;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 600; }
  .role { color: var(--muted); font-size: 0.9rem; }
  .actions { margin-left: auto; display: flex; gap: 0.75rem; }
  a { color: var(--accent); }
  .btn {
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.4rem 0.85rem;
    border: 1px solid var(--accent);
    border-radius: 6px;
    white-space: nowrap;
  }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  main { flex: 1; display: flex; }
  object, iframe { flex: 1; width: 100%; border: 0; min-height: 70vh; }
  .fallback { padding: 2rem 1.25rem; color: var(--muted); }
  footer {
    padding: 0.75rem 1.25rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Daniel Tu</h1>
    <span class="role">AI Engineer, Software Engineer</span>
    <span class="actions">
      <a class="btn primary" href="resume.pdf" download>Download PDF</a>
      <a class="btn" href="https://github.com/danghoangnhan/resume">Source</a>
    </span>
  </header>

  <main>
    <object data="resume.pdf" type="application/pdf" aria-label="Resume PDF">
      <div class="fallback">
        <p>Your browser can't display the PDF inline.</p>
        <p><a href="resume.pdf">Open resume.pdf directly</a>.</p>
      </div>
    </object>
  </main>

  <footer>
    Built from LaTeX source on every push to <code>main</code>.
  </footer>
</body>
</html>
