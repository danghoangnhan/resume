name: Build and Publish Resume PDF

on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.sty'
      - 'imgs/**'
      - '.github/pages/**'
      - '.github/workflows/build-resume.yml'
  # Validate the LaTeX before it reaches main. Every build in this project's
  # history failed at the compile step; this is the trigger that catches that
  # on a branch instead of on the published site.
  pull_request:
    paths:
      - '**.tex'
      - '**.sty'
      - 'imgs/**'
      - '.github/pages/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

# Least privilege by default. `build` also runs on pull_request and executes
# third-party actions plus an apt-get install, so it must not hold a token that
# can push to the repo or deploy Pages. Each publishing job re-grants only what
# it needs, and both are gated on main.
permissions:
  contents: read

# Don't let two runs on the same ref race each other to Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Full TeX Live image -- it carries mathdesign/Charter, the one
      # non-trivial dependency, so no package installation step is needed.
      #
      # texlive_version is pinned deliberately. This layout is hand-tuned to
      # exactly two pages; a hyphenation or metrics change in a newer TeX Live
      # can spill it onto a third page, and latexmk would still exit 0, so CI
      # would publish the broken layout without complaint.
      - name: Compile resume.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          texlive_version: 2025

      # latexmk exiting 0 only proves the LaTeX compiled. These assertions are
      # what actually protect the published document: the page count and the
      # box warnings are the two things that silently regress.
      - name: Assert layout did not regress
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pages=$(pdfinfo resume.pdf | awk '/^Pages:/ {print $2}')
          if [ "$pages" != "2" ]; then
            echo "::error::resume.pdf is $pages pages; expected 2"
            exit 1
          fi
          if grep -q 'Overfull\|Underfull' resume.log; then
            echo "::error::resume.log contains Overfull/Underfull boxes:"
            grep -n 'Overfull\|Underfull' resume.log
            exit 1
          fi
          echo "OK: 2 pages, no over/underfull boxes."

      - name: Upload PDF as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resume.pdf
          if-no-files-found: error

      - name: Assemble Pages site
        run: |
          mkdir -p site
          cp resume.pdf site/resume.pdf
          cp .github/pages/index.html site/index.html

      # Preview image for the README, rendered from the PDF that was just
      # built, so it can never drift from the actual resume. poppler-utils is
      # already installed by the layout assertion step above.
      - name: Render preview image
        run: pdftoppm -png -r 150 -f 1 -l 1 -singlefile resume.pdf site/preview

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Everything below runs only on main, so pull requests validate the build
  # without publishing anything.
  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # OIDC token required by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the PDF to the rolling "latest" release
    steps:
      - name: Download built PDF
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf

      - name: Update rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest resume
          body: Built automatically from ${{ github.sha }}.
          files: resume.pdf
          make_latest: true
